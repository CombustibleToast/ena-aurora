- type: entity # Aurora's Song - mostly just a reference
  parent: CMHeadCapMP
  id: CMHeadCap
  name: cap
  description: Standard baseball cap.
  abstract: true
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Head/Hats/cap.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Head/Hats/cap.rsi

- type: entity
  parent: CMHeadCapMP
  id: RMCHeadCapFlippable
  name: jungle cap # Aurora's Song - cap> jungle cap
  description: Standard baseball cap.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Head/Hats/cap/jungle.rsi
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon_flipped
      map: ["foldedLayer"]
      visible: false
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Head/Hats/cap/jungle.rsi
  - type: Appearance
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: fold-flip-verb
    foldVerbText: fold-flip-verb
  - type: FoldableClothing
    foldedEquippedPrefix: flipped
    foldedHeldPrefix: flipped
#  - type: ItemCamouflage # Aurora's Song - No camoflauge code, will add per-prototype variants
#    camouflageVariations:
#      Jungle: _RMC14/Objects/Clothing/Head/Hats/cap/jungle.rsi
#      Desert: _RMC14/Objects/Clothing/Head/Hats/cap/desert.rsi
#      Snow: _RMC14/Objects/Clothing/Head/Hats/cap/snow.rsi
#      Classic: _RMC14/Objects/Clothing/Head/Hats/cap/classic.rsi
#      Urban: _RMC14/Objects/Clothing/Head/Hats/cap/urban.rsi
  - type: GenericVisualizer
    visuals:
      enum.FoldedVisuals.State:
        foldedLayer:
          True: {visible: true}
          False: {visible: false}
        unfoldedLayer:
          True: {visible: false}
          False: {visible: true}

