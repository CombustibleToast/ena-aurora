# Aurora Song - Taken and modified from RMC14 at https://github.com/RMC-14/RMC-14/blob/b6bf62d08cbd3e392d6fe63031a06230955e833e/Resources/Prototypes/_RMC14/Entities/Clothing/Masks/scarfs.yml

- type: entity
  parent: [ClothingMaskBaseButcherable, BaseFoldable]
  id: RMCBaseScarfMask
  abstract: true
  components:
  - type: Appearance
  - type: Foldable
    canFoldInsideContainer: true
  - type: FoldableClothing
    foldedEquippedPrefix: flipped
    foldedHeldPrefix: flipped
  - type: Sprite
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon
      map: ["foldedLayer"]
      visible: false
  - type: Clothing
    slots:
      - mask
      - neck

- type: entity
  parent: RMCBaseScarfMask
  id: RMCBaseScarfDown
  suffix: down
  abstract: true
  components:
  - type: Foldable
    folded: true
  - type: Clothing
    equippedPrefix: flipped
  - type: Item
    heldPrefix: flipped
  - type: Sprite
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
      visible: false
    - state: icon
      map: ["foldedLayer"]
      visible: true

