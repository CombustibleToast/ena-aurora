- type: entity
  parent: TableBase
  id: SomberTable
  name: somber table
  description: "An expensive table made of gloomy, patterned wood with electrum accents."
  components:
  - type: Sprite
    sprite: _DEN/Structures/Furniture/Tables/somberwoodtable.rsi
  - type: Icon
    sprite: _DEN/Structures/Furniture/Tables/somberwoodtable.rsi
    state: full
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable # Aurora's Song - Extract damageContainer to Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 1 # Aurora's Song - Match the wooden table construction cost
            max: 1 # Aurora's Song - Match the wooden table construction cost
          ScrapElectrum:
            min: 1
            max: 1 # Aurora's Song - Match construction recipe cost
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWood
  - type: Tag
    tags:
    - Wooden
  # Aurora's Song start
  - type: Construction
    graph: Table
    node: SomberTable
  # Aurora's Song end

- type: entity
  parent: SomberTable
  id: SomberCounter
  name: somber counter
  description: "An expensive counter made of gloomy, patterned wood with electrum accents."
  components:
  - type: Sprite
    sprite: _DEN/Structures/Furniture/Tables/somberwoodcounter.rsi
  - type: Icon
    sprite: _DEN/Structures/Furniture/Tables/somberwoodcounter.rsi
    state: full
  # Aurora's Song start
  - type: Construction
    graph: Table
    node: SomberCounter
  # Aurora's Song end
