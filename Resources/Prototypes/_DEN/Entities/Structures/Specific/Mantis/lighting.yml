- type: entity
  parent: BaseStructure
  id: LightSomberEidoliteWellLamp
  name: eidolite well lamp
  description: "An eidolite pyramid that draws energy from the noosphere to produce light, recessed into the ground. You can turn it on by hand."
  suffix: Off
  components:
  - type: Sprite
    sprite: _DEN/Structures/Lighting/LightPosts/lampeidolitewell.rsi
    drawdepth: FloorObjects # Aurora's Song: Fixes rendering on top of things it shouldn't
    snapCardinals: true
    noRot: true
    layers:
    - state: base
    - state: glow
      shader: unshaded
      visible: false # Aurora's Song - Keep the glow in sync with the light.
      map: [ "enum.ToggleableVisuals.Layer" ] # Aurora's Song
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.125
          position: -0.0156,0.0156 # Half a pixel left and up from center
        hard: false
        density: 100
        mask:
        - MachineMask
  - type: Anchorable
  - type: InteractionOutline
  #- type: EtherealLight # Dims around ethereal entities
  - type: PointLight
    enabled: false
    radius: 3
    energy: 4
    softness: 1.1
    color: "#d9418d"
  - type: Appearance
  # Aurora's Song start - Hide the glow layer while the lamp is switched off.
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  # Aurora's Song end
  - type: ItemTogglePointLight
  - type: ItemToggle
    predictable: false
    soundActivate:
      path: /Audio/_DEN/Effects/crystalshimmer1.ogg
      params:
        volume: -2
        variation: 0.05
    soundDeactivate:
      path: /Audio/_DEN/Effects/crystalshimmer2.ogg
      params:
        volume: -2
        variation: 0.05
  # Aurora's Song start - Allow buttons and other signaling devices to toggle Mantis lights.
  - type: TriggerOnSignal
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: ItemToggleOnTrigger
    predicted: false
    showPopup: false
  # Aurora's Song end
  - type: UnpoweredFlashlight # Powered by the noosphere
  - type: Construction # Aurora's Song - Track the completed construction graph node.
    graph: MantisFurniture
    node: LightSomberEidoliteWellLamp
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable # Aurora's Song - Extract damageContainer to Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialEidolite1:
            min: 1
            max: 3
          MaterialMnemolith1:
            min: 1
            max: 1 # Aurora's Song - Match construction recipe cost
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak

- type: entity
  parent: LightSomberEidoliteWellLamp
  id: LightSomberEidoliteWellLampOn
  description: "An eidolite pyramid that draws energy from the noosphere to produce light, recessed into the ground. The switch on this one takes a few tries..."
  suffix: DO NOT MAP # If you do, it'll appear on, but they'll have to interact with it twice before it turns off again. It's more fun to manually light the office anyway
  components:
  - type: PointLight
    enabled: true

- type: entity
  parent: LightSomberEidoliteWellLamp
  id: LightSomberEidoliteFloorLamp
  name: eidolite floor lamp
  description: "An eidolite pyramid that draws energy from the noosphere to produce light, mounted on a mnemolith column. You can turn it on by hand."
  suffix: Off
  components:
  - type: Sprite
    sprite: _DEN/Structures/Lighting/LightPosts/lampeidolitefloor.rsi
    drawdepth: Objects
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.01,0.1,0.01,0.35"
        hard: true
        density: 200
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  #- type: EtherealLight # Dims around ethereal entities
  - type: PointLight
    enabled: false
    radius: 4
    energy: 6
  - type: Construction # Aurora's Song
    graph: MantisFurniture
    node: LightSomberEidoliteFloorLamp

- type: entity
  parent: LightSomberEidoliteFloorLamp
  id: LightSomberEidoliteFloorLampOn
  description: "An eidolite pyramid that draws energy from the noosphere to produce light, mounted on a mnemolith column. The switch on this one takes a few tries..."
  suffix: DO NOT MAP # If you do, it'll appear on, but they'll have to interact with it twice before it turns off again. It's more fun to manually light the office anyway
  components:
  - type: PointLight
    enabled: true
