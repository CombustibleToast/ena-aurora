# DeltaV Wooden Railings
- type: constructionGraph
  id: RailingWood
  start: start
  graph:
  - node: start
    actions:
    - !type:DestroyEntity {}
    edges:
    - to: RailingWood
      completed:
      - !type:SnapToGrid
      steps:
      - material: WoodPlank
        amount: 1
        doAfter: 1

  - node: RailingWood
    entity: RailingDeltaVWood
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: MaterialWoodPlank1
        amount: 1
      steps:
      - tool: Prying
        doAfter: 1

