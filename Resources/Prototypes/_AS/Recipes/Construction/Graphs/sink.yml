- type: constructionGraph
  id: ASSink
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: Sink
          completed:
            - !type:SnapToGrid
          steps:
            - material: Steel
              amount: 5
              doAfter: 1

    - node: Sink
      entity: Sink
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 5
          steps:
            - tool: Screwing
              doAfter: 1

