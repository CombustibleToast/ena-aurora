# Emote Granters
## Grants a certain emote on a marking.

- type: marking
  abstract: true
  id: EmoteHardThump
  emoteGrants:
  - emote: Thump
    sounds: ReptilianBodyEmotes

- type: marking
  abstract: true
  id: EmoteWhipThump
  emoteGrants:
  - emote: Thump
    sounds: ThavenTailEmotes

- type: marking
  abstract: true
  id: EmoteSmallHardThump
  emoteGrants:
  - emote: Thump
    sounds: AllulaloTailEmotes

- type: marking
  abstract: true
  id: EmoteFlutter
  emoteGrants:
  - emote: Flutter
    sounds: MothBodyEmotes

# Cyberlimbs
## (These are basic IPC parts, but they're also prosthetic markings for other species.)

## Exclude anything that doesn't have standard arms (e.g. harpies)
- type: marking
  abstract: true
  parent: BaseSpeciesIPC
  id: BaseArmsCyberlimb
  invertGroupWhitelist: true
  groupWhitelist:
  - Allulalo
  - Harpy
  - Vox
  - Diona
  - Decapoid

## Exclude anything that doesn't have standard legs (e.g. if any taurs are ever added)
- type: marking
  abstract: true
  parent: BaseSpeciesIPC
  id: BaseLegsCyberlimb
  invertGroupWhitelist: true
  groupWhitelist:
  - Allulalo
  - Harpy
  - Vox
  - Diona
  - Decapoid
