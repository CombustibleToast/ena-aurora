# Markings are inheriting. That means they can have parents now. Yay!

- type: marking
  abstract: true
  id: BaseColorWhite
  coloring:
    default:
      type:
        !type:SimpleColoring
          color: "#FFFFFF"

- type: marking
  abstract: true
  id: BaseTattoo
  coloring:
    default:
      type: !type:TattooColoring
      fallbackColor: "#666666"

