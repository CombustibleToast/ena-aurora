#region SLE

- type: entity
  parent: ClothingEyesHudSecurity
  id: ASClothingEyesHudSLE
  name: SLE hud
  description: A heads-up display that scans the humanoids in view and provides accurate data about their ID status and criminal records.
  components:
  - type: Sprite
    sprite: _AS/Clothing/Eyes/Hud/sle_hud.rsi
  - type: Clothing
    sprite: _AS/Clothing/Eyes/Hud/sle_hud.rsi

- type: entity
  parent: [ClothingEyesHudMedical, ASClothingEyesHudSLE]
  id: ASClothingEyesHudSLEMed
  name: corpsman hud
  description: An eye display that looks like a mixture of medical and SLE huds.
  components:
  - type: Sprite
    sprite: _AS/Clothing/Eyes/Hud/sle_hud.rsi
  - type: Clothing
    sprite: _AS/Clothing/Eyes/Hud/sle_hud.rsi
  - type: Construction
    graph: HudMedSec
    node: medsecHud

- type: entity
  parent: ClothingEyesHudSecurity
  id: ASClothingEyesHudSLEPatch
  name: SLE hud eyepatch
  description: A heads-up display that scans the humanoids in view and provides accurate data about their ID status and criminal records.
  components:
  - type: Sprite
    sprite: _AS/Clothing/Eyes/Hud/sle_patch.rsi
  - type: Clothing
    sprite: _AS/Clothing/Eyes/Hud/sle_patch.rsi

#region Clockwork

- type: entity
  parent: [ClothingEyesHudBase, ShowSecurityIcons, BaseC3Contraband, ContrabandClothing]
  id: ASClothingEyesClockworkHud
  name: judicial visor
  description: A visor worn by servants of Ratvar on the warpath which protects from intense visual stimuli.
  components:
  - type: Sprite
    sprite: _AS/Clothing/Eyes/Glasses/judicial_visor.rsi
  - type: Clothing
    sprite: _AS/Clothing/Eyes/Glasses/judicial_visor.rsi
  - type: FlashImmunity
  - type: EyeProtection
  - type: IdentityBlocker
    coverage: EYES

#region Universal

- type: entity
  parent: ClothingEyesHudBase
  id: ASClothingEyesHudUniversal
  name: universal status hud
  description: An advanced heads-up display providing the health and ID status of organics and robotics.
  components:
  - type: Sprite
    sprite: Clothing/Eyes/Hud/omni.rsi
  - type: Clothing
    sprite: Clothing/Eyes/Hud/omni.rsi
  - type: ShowHealthBars
    damageContainers:
    - Biological
    - Inorganic
    - Silicon
    - HumanoidSilicon
  - type: ShowHealthIcons
  - type: ShowJobIcons
  - type: ShowAccessReaderSettings
