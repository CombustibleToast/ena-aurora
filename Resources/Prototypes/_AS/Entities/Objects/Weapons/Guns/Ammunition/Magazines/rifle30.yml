#region base .30 Long marksman magazines

- type: entity
  id: ASBaseMagazineMarksmanRifle30Long
  name: magazine (.30 Long rifle)
  parent: NFBaseMagazineRifle30
  abstract: true
  components:
  - type: Tag
    tags:
      - ASMagazineMarksmanRifle30Long # TODO: make it make sense, change the tags
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - ASCartridgeRifle30Long
    proto: ASCartridgeRifle30Long
    capacity: 20
  - type: Sprite
    sprite: _AS/Objects/Weapons/Guns/Ammunition/Magazine/Rifle/marksmanrifle30_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-5
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Item
    sprite: _AS/Objects/Weapons/Guns/Ammunition/Magazine/Rifle/marksmanrifle30_mag.rsi
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  id: ASBaseMagazineEnblocRifle30Long
  parent: [NFBaseMagazineRifle30, RecyclableItemSteelTiny]
  name: en-bloc clip (.30 long rifle)
  abstract: true
  components:
  - type: Tag
    tags:
      - ASMagazineEnblocRifle30Long
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Ammunition/Magazine/lever_rifle_mags.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - ASCartridgeRifle30Long
    proto: ASCartridgeRifle30Long
    capacity: 8
  - type: Item
    sprite: _AS/Objects/Weapons/Guns/Ammunition/Magazine/Rifle/marksmanrifle30_mag.rsi
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

