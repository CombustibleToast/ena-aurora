- type: entity
  id: ASBaseWeaponFrameRifleArtificielFederale
  parent: [ NFBaseWeaponFrameRifleAssaultFrontierGunsmith ]
  abstract: true
  components:
  - type: Gun
    minAngle: 2
    maxAngle: 9
    angleIncrease: 1.5
    angleDecay: 5
    fireRate: 3.5 # fire rate tweak, increase | Aurora
  - type: NFWeaponDetails
    class: weapon-details-manufacturer-frontier-gunsmith-consortium

- type: entity
  id: ASBaseWeaponRifleMarksmanChamber30Long
  parent: NFBaseWeaponRifleAssaultChamber30
  abstract: true
  components:
  - type: Gun
    examineCaliber: gun-examine-caliber-30-long
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rifle2.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: ASMagazineMarksmanRifle30Long
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist: &mag30LongWhitelist
          tags:
            - ASMagazineMarksmanRifle30Long
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: ASCartridgeRifle30Long
        priority: 1
        whitelist: &chamber30LongWhitelist
          tags:
            - ASCartridgeRifle30Long

