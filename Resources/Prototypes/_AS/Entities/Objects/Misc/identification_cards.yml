- type: entity
  parent: [ ASIDCardStandard, C2ContrabandSyndicateRestrictedUnredeemable ]
  id: ASCorporateRepresentativeIDCardSyndicate
  name: syndicate representative ID card
  components:
  - type: Sprite
    sprite: Objects/Misc/id_cards.rsi
    layers:
    - state: black
    - state: stripe_top
      color: "#e80c0c"
    - state: stripe_bottom
      color: "#960606"
    - sprite: Interface/Misc/job_icons.rsi
      offset: -0.09375, 0.0625
      state: SyndicateCommander
  - type: IdCard
    jobIcon: JobIconSyndicateCommander
  - type: PresetIdCard
    job: CorporateRepresentative
  - type: Access
    tags:
    - SyndicateAgent

- type: entity
