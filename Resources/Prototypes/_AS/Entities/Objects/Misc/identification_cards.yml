  name: nanotrasen representative ID card
  components:
  - type: Sprite
    sprite: Objects/Misc/id_cards.rsi
    layers:
    - state: centcom
    - state: stripe_top
      color: "#134975"
    - state: stripe_bottom
      color: "#0d304d"
    - sprite: Interface/Misc/job_icons.rsi
      offset: -0.09375, 0.0625
      state: Nanotrasen
  - type: IdCard
    jobIcon: JobIconNanotrasen
  - type: PresetIdCard
    job: CorporateRepresentative
  - type: IdCard
    jobIcon: JobIconNanotrasen
  - type: Access
    tags:
    - CentralCommand
