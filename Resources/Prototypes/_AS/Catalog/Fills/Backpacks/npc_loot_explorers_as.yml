# EXPLORER NPC LOOT
## TIER 1
- type: entity
  parent: ExplorerDuffelGiftBox
  id: ASLootBagExplorerT1
  suffix: T1
  components:
  - type: SpawnItemsOnUse
    items:
    - id: MercCoin1
    # Scrap
    - id: ScrapOre
      amount: 2
    - id: SalvageSpawnerScrapCommon
    - id: SalvageSpawnerScrapValuable100
      prob: 0.50
    # Items
    - id: SalvageSpawnerTreasure
    - id: SpawnDungeonLootOresFull
      prob: 0.5
      amount: 2
    sound:
      path: /Audio/Items/jumpsuit_equip.ogg
  - type: Sprite
    sprite: Clothing/Back/Backpacks/salvage.rsi
    state: icon

## TIER 2
- type: entity
  parent: ExplorerDuffelGiftBox
  id: ASLootBagExplorerT2
  suffix: T2
  components:
  - type: SpawnItemsOnUse
    items:
    - id: MercCoin1
    # Scrap
    - id: ScrapOre
      amount: 3
    - id: SalvageSpawnerScrapCommon
    - id: SalvageSpawnerScrapValuable
      prob: 0.75
    # Items
    - id: SalvageSpawnerTreasure100
    - id: SalvageSpawnerTreasureValuable100
      prob: 0.25
    - id: SpawnDungeonLootOresFull
      prob: 0.75
      amount: 2
    - id: ASWeaponAdvancedHoloflareGun
      prob: 0.15
    # Bonus Loot
    - id: SpawnDungeonLootPartsEngi
      prob: 0.7
    sound:
      path: /Audio/Items/jumpsuit_equip.ogg
  - type: Sprite
    sprite: _NF/Clothing/Back/Messenger/color.rsi
    layers:
    - state: icon-base
      color: "#766245"
    - state: icon-sling
      color: "#5f539a"
    - state: icon-clasp
      color: "#eeeeee"

