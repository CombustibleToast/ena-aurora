#region WizDen
- type: entity
  id: NFWeaponRifleSniperHristov
  parent: [ NFBaseWeaponRifleChamber60, NFBaseWeaponFrameRifleSniperCybersun ]
  name: Hristov
  description: A portable anti-materiel rifle.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Snipers/heavy_sniper.rsi
    # Aurora's Song Start - RMC Bolt Action
    layers:
    - state: base
      map: [ "enum.BreechVisuals.Open" ]
    # Aurora's Song End
  - type: Clothing
    sprite: Objects/Weapons/Guns/Snipers/heavy_sniper.rsi
  # Aurora's Song Start - RMC Bolt Action
  - type: BreechLoaded
    needOpenClose: true
    openSound:
      path: "/Audio/_RMC14/Weapons/Guns/Breech/pkd_open_chamber.ogg"
    closeSound:
      path: "/Audio/_RMC14/Weapons/Guns/Breech/pkd_close_chamber.ogg"
  - type: GenericVisualizer
    visuals:
      enum.BreechVisuals.Open:
        enum.BreechVisuals.Open:
          True: { state: bolt-open }
          False: { state: base }
  # Aurora's Song End
