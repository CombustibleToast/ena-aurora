- type: entity
  id: BoxFunLizardPlushieBulk
  parent: CardboardBoxLargeWeh
  name: bulk lizard plushie box
  description: A buncha soft lizard plushies. Throw them around, hug them, wear them, wonder how you're gonna explain this purchase to your friends and co-workers.
  components:
  - type: EntityTableContainerFill # Aurora's Song - StorageFill>EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: MysteryWehBox
          amount: 3
        - id: PlushieLizard
          amount: 3

